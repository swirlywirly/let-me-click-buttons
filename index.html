
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Confetti Test</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #191919;
      font-family: Arial, sans-serif;
    }

    button {
      font-size: 22px;
      padding: 16px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="confetti-btn">𝙻𝚘𝚌𝚔𝚎𝚍 𝙸𝚗 .ᐟ.ᐟ </button>

  <script>
    document.getElementById("confetti-btn").addEventListener("click", () => {
      const duration = 2000;
      const end = Date.now() + duration;

      const interval = setInterval(() => {
        if (Date.now() > end) {
          clearInterval(interval);
          return;
        }

        confetti({
          particleCount: 5,
          angle: 30,
          spread: 100,
          origin: { x: 30, y: 0.7 }
        });

        confetti({
          particleCount: 8,
          angle: 120,
          spread: 70,
          origin: { x: 1, y: 0.7 }
        });
      }, 50);
    });
  </script>

</body>
</html>
